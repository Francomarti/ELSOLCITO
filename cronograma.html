<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma — Portal SuTurf</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="site hero-bg alt">
    <div class="brand-row">
      <img src="assets/logo-suturf.png" alt="SuTurf Tandil">
      <span class="x">×</span>
      <div class="logo-chip"><img src="assets/logo-solcito.png" alt="Club El Solcito"></div>
    </div>
    <div class="header-titles">
      <div class="eyebrow">SuTurf Tandil · Ing. Agr. Franco Martignoni</div>
      <h1>Cómo venimos con el plan</h1>
    </div>
    <nav class="site">
      <a href="index.html">Inicio</a>
      <a href="cronograma.html" class="active">Cronograma</a>
      <a href="facturas.html">Facturación</a>
      <a href="insumos.html">Insumos</a>
    </nav>
  </header>
  <div class="club-stripe"></div>

  <div class="hero-progress" id="hero"></div>

  <div id="next-banner"></div>

  <div class="section-title">Cambios sobre el plan original <span>por qué se movió algo</span></div>
  <div id="cambios-list" class="timeline"></div>

  <div class="section-title">Detalle mes a mes <span>lo que se hizo y lo que falta</span></div>
  <div id="lista"></div>

  <div class="footer-note">Última actualización según el cronograma cargado por SuTurf Tandil.</div>
</div>

<script src="js/app.js"></script>
<script>
(async function () {
  const plan = await cargarJSON("data/plan.json");
  const meta = plan.meta || { cuotaFija: 0, mesesTranscurridos: 1 };
  const tareas = plan.tareas || [];
  const cambios = plan.cambios || [];

  // ---- Hero de progreso ----
  const totalInterv = tareas.reduce((s, t) => s + Number(t.intervenciones || 0), 0);
  const hechasInterv = tareas.filter(t => t.estado === "realizado").reduce((s, t) => s + Number(t.intervenciones || 0), 0);
  const pct = totalInterv ? Math.round((hechasInterv / totalInterv) * 100) : 0;

  const totalPlan = tareas.reduce((s, t) => s + Number(t.valor || 0), 0);
  const totalRealizado = tareas.filter(t => t.estado === "realizado").reduce((s, t) => s + Number(t.valor || 0), 0);
  const cuotaEsperada = (meta.cuotaFija || 0) * (meta.mesesTranscurridos || 0);
  const diferencia = totalRealizado - cuotaEsperada;

  document.getElementById("hero").innerHTML = `
    <div class="progress-ring" style="--pct:${pct}">
      <div class="progress-ring-inner">
        <span>${pct}%</span>
        <small>del plan hecho</small>
      </div>
    </div>
    <div class="hero-stats">
      <div class="hero-stat">
        <strong>${hechasInterv} / ${totalInterv}</strong>
        <span>intervenciones realizadas</span>
      </div>
      <div class="hero-stat">
        <strong>${meta.mesesTranscurridos || 0} / 12</strong>
        <span>meses del contrato</span>
      </div>
      <div class="hero-stat ${diferencia >= 0 ? "pos" : "neg"}">
        <strong>${diferencia >= 0 ? "+" : ""}${fmt(diferencia)}</strong>
        <span>trabajo hecho vs. cuota cobrada</span>
      </div>
    </div>
    <div class="hero-footline"><strong style="color:#002A5C;">Período: ${meta.periodo || "a definir"}</strong> · Cuota fija: ${fmt(meta.cuotaFija)}/mes · Plan anual: ${fmt(totalPlan)} · Realizado: ${fmt(totalRealizado)}</div>
  `;

  // ---- Próxima tarea ----
  const proxima = tareas.find(t => t.estado !== "realizado");
  if (proxima) {
    document.getElementById("next-banner").innerHTML = `
      <div class="next-banner">
        <div class="label">Próxima tarea</div>
        <div class="tarea">${proxima.tarea}</div>
        <div class="meta">${proxima.mes} ${proxima.anio} · ${proxima.zona}${proxima.valor ? " · " + fmt(proxima.valor) : ""}</div>
      </div>`;
  }

  // ---- Cambios sobre el plan ----
  const cambiosList = document.getElementById("cambios-list");
  if (!cambios || cambios.length === 0) {
    cambiosList.innerHTML = `<div class="timeline-empty">Por ahora el trabajo fue tal cual el plan original — sin cambios que registrar.</div>`;
  } else {
    const tipoLabel = { adelanto: "Adelanto", agregado: "Tarea agregada", modificacion: "Modificación" };
    cambiosList.innerHTML = cambios.map(c => `
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-body">
          <div class="timeline-top">
            <span class="timeline-tipo">${tipoLabel[c.tipo] || "Cambio"}</span>
            <span class="timeline-fecha">${c.fecha}</span>
          </div>
          <div class="timeline-titulo">${c.titulo}</div>
          <div class="timeline-detalle">${c.detalle}</div>
          ${c.impacto ? `<div class="timeline-impacto">Impacto: ${fmt(c.impacto)}</div>` : ""}
        </div>
      </div>`).join("");
  }

  // ---- Detalle mes a mes ----
  if (tareas.length === 0) {
    document.getElementById("lista").innerHTML = `<div class="timeline-empty" style="margin:0 20px;">Todavía no hay tareas cargadas. Se cargan desde el panel de administración.</div>`;
  } else {
    const grupos = [];
    tareas.forEach(t => {
      const key = t.mes + "-" + t.anio;
      let g = grupos.find(x => x.key === key);
      if (!g) { g = { key, mes: t.mes, anio: t.anio, items: [] }; grupos.push(g); }
      g.items.push(t);
    });

    document.getElementById("lista").innerHTML = grupos.map(g => `
      <div class="mini-section-title">${g.mes} <span>${g.anio}</span></div>
      <div class="list">
        ${g.items.map(t => `
          <div class="item ${t.estado === "realizado" ? "done" : ""}">
            <div class="check">${t.estado === "realizado" ? "✓" : ""}</div>
            <div class="item-body">
              <div class="tarea">${t.tarea}</div>
              <div class="meta">${t.zona}${t.intervenciones ? " · " + t.intervenciones + " interv." : ""}${t.notas ? " · " + t.notas : ""}</div>
            </div>
            ${t.valor ? `<div class="valor">${fmt(t.valor)}</div>` : ""}
          </div>`).join("")}
      </div>`).join("");
  }
})();
</script>
</body>
</html>
