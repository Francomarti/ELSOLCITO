<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facturación — Portal SuTurf</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="site hero-bg alt">
    <div class="brand-row">
      <img src="assets/logo-suturf.png" alt="SuTurf Tandil">
      <span class="x">×</span>
      <div class="logo-chip"><img src="assets/logo-solcito.png" alt="Club El Solcito"></div>
    </div>
    <div class="header-titles">
      <div class="eyebrow">SuTurf Tandil · Ing. Agr. Franco Martignoni</div>
      <h1>Facturación y pagos</h1>
    </div>
    <nav class="site">
      <a href="index.html">Inicio</a>
      <a href="cronograma.html">Obra</a>
      <a href="facturas.html" class="active">Facturación</a>
      <a href="insumos.html">Materiales</a>
    </nav>
  </header>
  <div class="club-stripe"></div>
  <div id="debt-banner"></div>
  <div class="cards" id="cards"></div>
  <div class="section-title">Detalle de facturas</div>
  <table class="facturas">
    <thead>
      <tr>
        <th>N°</th>
        <th>Fecha</th>
        <th>Concepto</th>
        <th>Monto</th>
        <th>Estado</th>
        <th>Fecha pago</th>
        <th>Factura</th>
      </tr>
    </thead>
    <tbody id="tabla-facturas"></tbody>
  </table>
  <div class="footer-note">Para actualizar: usar el panel de carga privado.</div>
</div>
<script src="js/app.js"></script>
<script>
(async function () {
  const facturas = await cargarJSON("data/facturas.json");
  const totalFacturado = facturas.reduce((s, f) => s + Number(f.monto || 0), 0);
  const totalCobrado = facturas.reduce((s, f) => s + Number(f.montoPagado || 0), 0);
  const saldo = totalFacturado - totalCobrado;
  const pendientes = facturas.filter(f => f.estado !== "pagada").length;

  if (saldo > 0) {
    document.getElementById("debt-banner").innerHTML = `
      <div class="next-banner" style="border-left-color:var(--rojo-alerta); background:var(--rojo-alerta-bg);">
        <div class="label" style="color:var(--rojo-alerta);">⚠ Pagos pendientes</div>
        <div class="tarea" style="color:var(--rojo-alerta);">${fmt(saldo)} adeudado</div>
        <div class="meta">${pendientes} factura${pendientes === 1 ? "" : "s"} sin cobrar</div>
      </div>`;
  }

  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="label">Total facturado</div><div class="value">${fmt(totalFacturado)}</div></div>
    <div class="card"><div class="label">Total cobrado</div><div class="value">${fmt(totalCobrado)}</div></div>
    <div class="card ${saldo > 0 ? "neg" : "pos"}"><div class="label">Saldo pendiente</div><div class="value">${fmt(saldo)}</div></div>
    <div class="card"><div class="label">Facturas sin cobrar</div><div class="value">${pendientes}</div></div>`;
  const estadoLabel = { pagada: "Pagada", pendiente: "Pendiente", parcial: "Pago parcial" };
  if (facturas.length === 0) {
    document.getElementById("tabla-facturas").innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:16px;">Todavía no hay facturas cargadas.</td></tr>`;
  } else {
    document.getElementById("tabla-facturas").innerHTML = facturas
      .slice()
      .sort((a, b) => new Date(b.fecha) - new Date(a.fecha))
      .map(f => `
        <tr>
          <td>${f.numero}</td>
          <td>${fmtFecha(f.fecha)}</td>
          <td>${f.concepto}</td>
          <td>${fmt(f.monto)}</td>
          <td><span class="estado-pill estado-${f.estado}">${estadoLabel[f.estado] || f.estado}</span></td>
          <td>${fmtFecha(f.fechaPago)}</td>
          <td>${f.pdf ? `<a class="pdf-link" href="${f.pdf}" target="_blank" rel="noopener">📄 Ver PDF</a>` : `<span class="pdf-none">—</span>`}</td>
        </tr>`).join("");
  }
})();
</script>
</body>
</html>
